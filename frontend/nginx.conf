# We define a server for nginx -> How to handle requests for this website
server {
    # Nginx listens on port 80
    listen 80;

    # Tell Nginx where my website files are located
    root /usr/share/nginx/html;

    # Tells Nginx when someone requests for the root of the website, use index.html
    index index.html;

    # React Router/client-side routing -> any unmatched path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite already content-hashes filenames
    # The files whose content is changed gets a new hashed filename and when redeploying
    # Browser downloads only the new files and cached the old files. 
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}